name: Weekly news and information tracker

on:
  schedule:
    # Monday 00:05 UTC = Monday 08:05 Asia/Singapore.
    - cron: "5 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-news-information-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public source metadata
        run: python tools/weekly_news_tracker.py

      - name: Rebuild website cache version
        run: python build.py

      - name: Validate generated files
        run: |
          git diff --check
          python -m json.tool tools/weekly_news_sources.json >/dev/null
          python -m json.tool data/weekly_news/history.json >/dev/null
          python -m json.tool docs/news_tracker.json >/dev/null
          python -m json.tool docs/data.json >/dev/null

      - name: Commit and publish when data changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/weekly-news.yml tools/weekly_news_tracker.py tools/weekly_news_sources.json data/weekly_news docs/news_tracker.json docs/data.json docs/sw.js
          git commit -m "data: refresh weekly information tracker"
          git pull --rebase origin main
          git push
