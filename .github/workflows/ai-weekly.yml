name: AI industry weekly monitor

on:
  schedule:
    # Sunday 23:15 UTC = Monday 07:15 Asia/Singapore.
    - cron: "15 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-industry-weekly-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate weekly AI monitor
        run: python tools/ai_weekly_tracker.py

      - name: Rebuild website index
        run: python build.py

      - name: Validate generated files
        run: |
          git diff --check
          python -m json.tool data/ai_weekly/history.json >/dev/null
          python -m json.tool docs/data.json >/dev/null

      - name: Commit and publish when data changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ai-weekly.yml tools/ai_weekly_tracker.py tools/ai_weekly_sources.json data/ai_weekly content/industries docs/data.json docs/sw.js
          git commit -m "record: weekly AI industry monitor"
          git push
